name: Something isn't working
description: Tell me what went wrong. The more you can say, the easier it is to fix.
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Your device
      description: For example AYN Odin 2, Retroid Pocket 5, or a phone with a Bluetooth controller.
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      description: Settings, About phone.
  - type: input
    id: version
    attributes:
      label: Inlay version
      description: Open Inlay, then About. The number is at the top.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you press, what did you expect, what happened instead? A screenshot helps.
    validations:
      required: true
